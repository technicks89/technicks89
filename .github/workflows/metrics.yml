# Needs a personal access token in the repo secret GH_PAT (scopes: repo, read:user).
# Reference: https://github.com/lowlighter/metrics
name: Metrics
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GH_PAT }}
          output_action: none
          user: technicks89
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      - name: Copy rendered metrics
        run: |
          test -s /metrics_renders/github-metrics.svg
          cp /metrics_renders/github-metrics.svg github-metrics.svg
      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git diff --cached --quiet || git commit -m "Update github-metrics.svg [skip ci]"
          git push
