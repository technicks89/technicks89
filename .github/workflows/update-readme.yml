name: Update README
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.tmpl, .github/scripts/**, .github/workflows/update-readme.yml]
jobs:
  readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: profile-update-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Render README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/render-readme.py README.tmpl "$RUNNER_TEMP/README.md"
          mv "$RUNNER_TEMP/README.md" README.md
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update README.md [skip ci]"
          git push
